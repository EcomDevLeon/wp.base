# version: "3.6"
services:

    php:
        container_name: ${DOCKER_APP_NAME}.php
        build:
            context: ./docker/php/
            dockerfile: Dockerfile
        user: www-data
        working_dir: /var/www/nginx/
        volumes:
            - ./nginx_webroot:/var/www/nginx
            - ./docker/php/conf.d/settings.ini:/usr/local/etc/php/conf.d/settings.ini:ro
        networks:
            - ${DOCKER_APP_NAME}.host
        environment:
            TZ: ${APP_TIMEZONE}

    nginx:
        container_name: ${DOCKER_APP_NAME}.nginx
        image: nginx:1.31.5
        ports:
            - 16220:80
            - 16226:81
        volumes:
            - ./nginx_webroot:/var/www/nginx
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - ./docker/nginx/logs:/var/log/nginx
        depends_on:
            php:
                condition: service_started
            mariadb:
                condition: service_started
        networks:
            - ${DOCKER_APP_NAME}.host
        environment:
            TZ: ${APP_TIMEZONE}
        restart: unless-stopped 

    mariadb:
        container_name: ${DOCKER_APP_NAME}.mariadb
        image: mariadb:13.0.1-ubi-rc
        volumes:
            - ./docker/mariadb/data:/var/lib/mariadb
        environment:
            MARIADB_ROOT_PASSWORD: root
            MARIADB_USER: ${DB_USERNAME}
            MARIADB_PASSWORD: ${DB_PASSWORD}
            MARIADB_DATABASE: ${DB_DATABASE}
            TZ: ${APP_TIMEZONE}
        ports:
            - 16222:3306
        networks:
            - ${DOCKER_APP_NAME}.host
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "mariadbadmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
    redis:
        container_name: ${DOCKER_APP_NAME}.redis
        image: redis:8.10
        environment:
            TZ: ${APP_TIMEZONE}
        ports:
            - 16225:6379
        networks:
            - ${DOCKER_APP_NAME}.host
        restart: unless-stopped
            
networks:
    leonwp.host:
        name: ${DOCKER_APP_NAME}.host
        driver: bridge
